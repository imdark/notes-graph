name: Test Rust addon cache (temporary)

# TEMPORARY, for PR #403 only: delete before merging. Builds the prod image the
# way deploy-prod.yml does (same Dockerfile, build args and contexts) twice,
# without pushing or deploying: first with an empty cache (the miss path,
# which compiles and keeps the addon), then with that cache (the hit path,
# which must skip the `native` stage). Each checks the addon is in the image.

on:
  push:
    branches: [deploy-reuse-rust-addon-when-unchanged]

permissions:
  contents: read

env:
  # A key per run, so the first job always misses and the second always hits.
  KEY_SUFFIX: test-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  miss:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@v3
      - name: Restore the Rust addon
        id: native
        uses: actions/cache/restore@v4
        with:
          path: native-prebuilt
          key: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**', '.github/deployment/node/Dockerfile.selfhost') }}-${{ env.KEY_SUFFIX }}
      - name: Expect a miss
        run: test "${{ steps.native.outputs.cache-hit }}" != "true"
      - name: Addon context
        run: mkdir -p native-prebuilt
      - name: Build image (miss)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile.selfhost
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NATIVE_STAGE=${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
          build-contexts: native-prebuilt-files=native-prebuilt
          tags: notesgraph:miss
          load: true
      - name: Export the Rust addon
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --target native-export --output type=local,dest=native-prebuilt .
          test -s native-prebuilt/server-native.node
          ls -la native-prebuilt
      - name: Save the Rust addon
        uses: actions/cache/save@v4
        with:
          path: native-prebuilt
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: Addon is in the image
        run: |
          found=$(docker run --rm --entrypoint sh notesgraph:miss -c 'find / -name "server-native*.node" -not -path "/proc/*" 2>/dev/null')
          echo "$found"
          test -n "$found"

  hit:
    needs: miss
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@v3
      - name: Restore the Rust addon
        id: native
        uses: actions/cache/restore@v4
        with:
          path: native-prebuilt
          key: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**', '.github/deployment/node/Dockerfile.selfhost') }}-${{ env.KEY_SUFFIX }}
      - name: Expect a hit
        run: test "${{ steps.native.outputs.cache-hit }}" = "true"
      - name: Addon context
        run: mkdir -p native-prebuilt
      - name: Build image (hit)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile.selfhost
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NATIVE_STAGE=${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
          build-contexts: native-prebuilt-files=native-prebuilt
          tags: notesgraph:hit
          load: true
      - name: Addon is in the image
        run: |
          found=$(docker run --rm --entrypoint sh notesgraph:hit -c 'find / -name "server-native*.node" -not -path "/proc/*" 2>/dev/null')
          echo "$found"
          test -n "$found"
