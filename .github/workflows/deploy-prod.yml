name: Deploy prod

# Deploys main to app.notesgraph.com without SSH or stored keys:
#   1. builds the server image here (Dockerfile.selfhost), so the RAM-heavy
#      bundling never runs on the 7.6 GB box;
#   2. pushes it to the private ECR repo notesgraph;
#   3. runs scripts/prod/deploy-image.sh on the box over SSM, which pulls the
#      image and does the rest (landing page, sidecars, backup, roll).
#
# AWS access is a short-lived OIDC session for the notesgraph-github-deploy
# role, which only jobs in the `production` environment (main only) can
# assume; see scripts/prod/setup-github-deploy-aws.sh.
#
# Run it from the Actions tab, or: gh workflow run deploy-prod.yml
#
# Rollback: give image_sha (a commit whose image is still in ECR) and the run
# skips the build and rolls the box to that image, with that commit's
# deploy-image.sh. The run is titled "Roll back to <sha>", which the
# Deployments screen reads to tell a rollback from a deploy.
#   gh workflow run deploy-prod.yml -f image_sha=<40-char sha>

run-name: ${{ inputs.image_sha && format('Roll back to {0}', inputs.image_sha) || format('Deploy {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Roll back to the image of this commit (full sha); empty builds and deploys the branch'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  INSTANCE_ID: i-025bea042bd6b9b1d

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.notesgraph.com
    timeout-minutes: 120
    # The workflow's own, plus starting build-apk.yml after Verify.
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      # Full history: deploy-info lists the pull requests merged into HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy record
        if: inputs.image_sha == ''
        run: node scripts/prod/deploy-info.mjs

      # The runner ships ~14 GB free on / and the build needs more: put
      # Docker's data on the runner's second disk (see the script).
      - name: Disk for Docker
        if: inputs.image_sha == ''
        run: scripts/ci/docker-disk.sh

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::726029337107:role/notesgraph-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # A rollback deploys an image already built: it has to still be there.
      - name: Check image
        if: inputs.image_sha != ''
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a full 40-character commit sha, got '$IMAGE_SHA'"
            exit 1
          fi
          aws ecr describe-images --repository-name notesgraph \
            --image-ids imageTag="$IMAGE_SHA" --query 'imageDetails[0].imagePushedAt' --output text

      - uses: docker/setup-buildx-action@v3
        if: inputs.image_sha == ''
        with:
          # Removing the builder at the end was ~50 s on a runner that is
          # thrown away anyway.
          cleanup: false

      # The Rust addon is ~10 of the build's ~15 min (it compiles from
      # scratch on every runner) and its sources rarely change. Keep the
      # compiled file keyed on everything the Dockerfile's `native` stage
      # reads; on a hit the build takes it instead and never runs `native`.
      # Only the Dockerfile stages that build the addon count: hashing the
      # whole file made any Dockerfile edit recompile it (~10 min).
      - name: Rust addon stages
        id: native_stages
        if: inputs.image_sha == ''
        run: echo "hash=$(scripts/ci/native-stage-hash.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore the Rust addon
        id: native
        if: inputs.image_sha == ''
        env:
          KEY: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**') }}-${{ steps.native_stages.outputs.hash }}
        run: scripts/ci/s3-cache.sh restore native-prebuilt "$KEY"

      # The .br/.gz of the last deploy's static assets, by content hash: most
      # files are byte-identical between deploys, so docker-clean copies their
      # compressed forms back instead of re-running brotli on them.
      - name: Restore compressed assets
        if: inputs.image_sha == ''
        run: scripts/ci/s3-cache.sh restore compress-cache compressed-assets-${{ github.sha }} compressed-assets-

      # yarn's download cache, keyed on the lockfile: with the same yarn.lock
      # it holds every package, so the fetch step (~95 s) has nothing to
      # download and there's nothing new to save.
      - name: Restore the yarn cache
        id: yarn
        if: inputs.image_sha == ''
        env:
          KEY: yarn-cache-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
        run: scripts/ci/s3-cache.sh restore yarn-cache "$KEY" yarn-cache-

      # rspack's module caches for the web, admin and mobile bundles: a warm
      # web build compiles in ~1.5 s instead of ~11 s. Changes every deploy,
      # so like the compressed assets it's kept per commit, newest restored.
      # It grows with every deploy (2.1 GB by 2026-11-26, when its export
      # stalled for 22 min), so past 1 GB it's dropped: one cold build
      # (~10 s more), and the cache saved after it starts small again.
      - name: Restore the bundler cache
        if: inputs.image_sha == ''
        run: |
          scripts/ci/s3-cache.sh restore rspack-cache rspack-cache-${{ github.sha }} rspack-cache-
          size_mb=$(du -sm rspack-cache 2>/dev/null | cut -f1)
          if [ "${size_mb:-0}" -gt 1024 ]; then
            echo "bundler cache is ${size_mb} MB, over 1 GB: dropping it for a cold build"
            rm -rf rspack-cache
          fi

      - name: Build contexts
        if: inputs.image_sha == ''
        run: mkdir -p native-prebuilt compress-cache yarn-cache rspack-cache

      - name: Build and push image
        id: build
        if: inputs.image_sha == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile.selfhost
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NATIVE_STAGE=${{ steps.native.outputs.hit == 'true' && 'native-prebuilt' || 'native' }}
          # Always given (empty on a miss), so the unused stage that names it
          # can't make BuildKit look for an image of that name.
          build-contexts: |
            native-prebuilt-files=native-prebuilt
            compress-cache-files=compress-cache
            yarn-cache-files=yarn-cache
            rspack-cache-files=rspack-cache
          tags: ${{ steps.ecr.outputs.registry }}/notesgraph:${{ github.sha }}
          push: true
          # No layer cache: `COPY . .` comes before yarn install, so a new
          # commit rebuilds every expensive layer anyway, and exporting the
          # cache cost 14 min to save ~25 s. The Rust addon is kept on its
          # own instead (above and below).

      # The box rolls as soon as the image is pushed. The build caches are
      # exported after it (below): they only speed up the next deploy, and
      # one once took 18+ min, holding prod and the APK build back with it.
      - name: Roll the box
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/notesgraph:${{ inputs.image_sha || github.sha }}
          SHA: ${{ inputs.image_sha || github.sha }}
        run: |
          # As ubuntu: bring the deploy checkout to this commit, then run its
          # deploy-image.sh. The repo is public, so the fetch needs no token.
          script=$(cat <<EOF
          set -e
          D=/home/ubuntu/notes-graph-deploy
          test -d \$D/.git || git clone -q --filter=blob:none https://github.com/${GITHUB_REPOSITORY} \$D
          git -C \$D fetch -q origin $SHA
          git -C \$D checkout -q -f --detach $SHA
          exec bash \$D/scripts/prod/deploy-image.sh $IMAGE
          EOF
          )
          params=$(jq -n --arg s "$script" \
            '{commands: ["sudo -u ubuntu -H bash -c " + ($s | @sh)], executionTimeout: ["3600"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $SHA" \
            --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $id"

          # Wait for it; a deploy takes longer than `aws ssm wait` allows.
          for _ in $(seq 1 240); do
            status=$(aws ssm get-command-invocation --command-id "$id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]

      # The server is a few seconds old when the roll ends (the roll stopped
      # re-running the migration, which used to give it ~30 s to boot), so
      # wait for it: up to 2 min, then fail as before.
      - name: Verify
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://app.notesgraph.com || echo 000)
            echo "app.notesgraph.com -> HTTP $code (try $i)"
            [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && exit 0
            sleep 5
          done
          exit 1

      # A release also rebuilds the Android APK, if the deployed commit
      # changed the app since the published one (build-apk.yml checks). It
      # is started as its own run, so this one (and the deploy-prod
      # concurrency group) doesn't wait ~25 min on it and an APK failure
      # doesn't read as a failed deploy. Right after Verify, not after the
      # cache exports. A rollback builds nothing.
      - name: Start the APK build
        if: inputs.image_sha == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f ref="$GITHUB_SHA" -f force=false
          echo "Started build-apk.yml for $GITHUB_SHA (force=false)" >> "$GITHUB_STEP_SUMMARY"

      # ---- build caches for the next deploy ----
      # Each runs even when the roll or Verify failed (the image built, so
      # its caches are good), and none can fail the deploy: a lost cache
      # only makes the next build slower.

      # A miss compiled the addon in the build above; take it from this
      # builder's layers (seconds, nothing recompiles) and keep it.
      - name: Export the Rust addon
        id: native_export
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --target native-export --output type=local,dest=native-prebuilt .
          test -s native-prebuilt/server-native.node

      # A save only follows its export's success: saving after a failed one
      # would keep an empty or partial cache for the next deploy to restore.
      - name: Save the Rust addon
        if: ${{ !cancelled() && steps.native_export.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          KEY: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**') }}-${{ steps.native_stages.outputs.hash }}
        run: scripts/ci/s3-cache.sh save native-prebuilt "$KEY"

      # This build's compressed assets, from the builder's layers: the same
      # args and contexts as the build above, so nothing re-runs. Written
      # beside the restored cache and swapped in, since changing that folder
      # first would change the build's inputs.
      - name: Export compressed assets
        id: compress_export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          NATIVE_STAGE: ${{ steps.native.outputs.hit == 'true' && 'native-prebuilt' || 'native' }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg NATIVE_STAGE="$NATIVE_STAGE" \
            --build-context native-prebuilt-files=native-prebuilt \
            --build-context compress-cache-files=compress-cache \
            --build-context yarn-cache-files=yarn-cache \
            --build-context rspack-cache-files=rspack-cache \
            --target compress-cache-export --output type=local,dest=compress-cache-new .
          rm -rf compress-cache && mv compress-cache-new compress-cache
          echo "$(find compress-cache -type f | wc -l) files, $(du -sh compress-cache | cut -f1)"

      - name: Save compressed assets
        if: ${{ !cancelled() && steps.compress_export.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/ci/s3-cache.sh save compress-cache compressed-assets-${{ github.sha }}

      - name: Export the bundler cache
        id: rspack_export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          NATIVE_STAGE: ${{ steps.native.outputs.hit == 'true' && 'native-prebuilt' || 'native' }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg NATIVE_STAGE="$NATIVE_STAGE" \
            --build-context native-prebuilt-files=native-prebuilt \
            --build-context compress-cache-files=compress-cache \
            --build-context yarn-cache-files=yarn-cache \
            --build-context rspack-cache-files=rspack-cache \
            --target rspack-cache-export --output type=local,dest=rspack-cache-new .
          rm -rf rspack-cache && mv rspack-cache-new rspack-cache
          du -sh rspack-cache

      - name: Save the bundler cache
        if: ${{ !cancelled() && steps.rspack_export.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/ci/s3-cache.sh save rspack-cache rspack-cache-${{ github.sha }}

      # Only when yarn.lock changed (no exact cache): the cache after this
      # build's install, from the builder's cache mount.
      - name: Export the yarn cache
        id: yarn_export
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.yarn.outputs.hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          NATIVE_STAGE: ${{ steps.native.outputs.hit == 'true' && 'native-prebuilt' || 'native' }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg NATIVE_STAGE="$NATIVE_STAGE" \
            --build-context native-prebuilt-files=native-prebuilt \
            --build-context compress-cache-files=compress-cache \
            --build-context yarn-cache-files=yarn-cache \
            --build-context rspack-cache-files=rspack-cache \
            --target yarn-cache-export --output type=local,dest=yarn-cache-new .
          rm -rf yarn-cache && mv yarn-cache-new yarn-cache
          echo "$(find yarn-cache -type f | wc -l) files, $(du -sh yarn-cache | cut -f1)"

      - name: Save the yarn cache
        if: ${{ !cancelled() && steps.yarn_export.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          KEY: yarn-cache-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
        run: scripts/ci/s3-cache.sh save yarn-cache "$KEY"
