name: Copilot Test Automatically

# Manual only: the schedule dispatched to a `canary` branch this repo doesn't
# have, and the tests need secrets.TEST_SERVER_CONFIG.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-test:
    runs-on: ubuntu-latest
    name: Setup Test
    steps:
      - name: dispatch test
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: copilot-test.yml
