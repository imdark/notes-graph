name: Test yarn cache (temporary)

# TEMPORARY: measure keeping yarn's download cache. Delete before merging.
# Builds the prod image as deploy-prod.yml does (no push): `first` with no
# yarn cache (saves one), `second` restoring it. Compare yarn's Fetch step.

on:
  push:
    branches: [deploy-keep-yarn-cache]

permissions:
  contents: read

jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - &disk
        name: Disk for Docker
        run: scripts/ci/docker-disk.sh
      - &buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - &restore_native
        name: Restore the Rust addon
        id: native
        uses: actions/cache/restore@v4
        with:
          path: native-prebuilt
          key: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**', '.github/deployment/node/Dockerfile.selfhost') }}
      - &restore_compress
        name: Restore compressed assets
        uses: actions/cache/restore@v4
        with:
          path: compress-cache
          key: compressed-assets-${{ github.sha }}-${{ github.job }}
          restore-keys: compressed-assets-
      - &restore_yarn
        name: Restore the yarn cache
        id: yarn
        uses: actions/cache/restore@v4
        with:
          path: yarn-cache
          key: yarn-cache-test-${{ github.run_id }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - &contexts
        name: Build contexts
        run: |
          mkdir -p native-prebuilt compress-cache yarn-cache
          echo "yarn cache in: $(ls yarn-cache | wc -l) files, $(du -sh yarn-cache | cut -f1)"
      - &build
        name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile.selfhost
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NATIVE_STAGE=${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
          build-contexts: |
            native-prebuilt-files=native-prebuilt
            compress-cache-files=compress-cache
            yarn-cache-files=yarn-cache
          tags: notesgraph:test
          load: true
      - &export_native
        name: Export the Rust addon
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --target native-export --output type=local,dest=native-prebuilt .
          test -s native-prebuilt/server-native.node
      - &save_native
        name: Save the Rust addon
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-prebuilt
          key: ${{ steps.native.outputs.cache-primary-key }}
      - &export_yarn
        name: Export the yarn cache
        if: steps.yarn.outputs.cache-hit != 'true'
        env:
          NATIVE_STAGE: ${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg NATIVE_STAGE="$NATIVE_STAGE" \
            --build-context native-prebuilt-files=native-prebuilt \
            --build-context compress-cache-files=compress-cache \
            --build-context yarn-cache-files=yarn-cache \
            --target yarn-cache-export --output type=local,dest=yarn-cache-new .
          rm -rf yarn-cache && mv yarn-cache-new yarn-cache
          echo "$(ls yarn-cache | wc -l) files, $(du -sh yarn-cache | cut -f1)"
      - &save_yarn
        name: Save the yarn cache
        if: steps.yarn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: yarn-cache
          key: ${{ steps.yarn.outputs.cache-primary-key }}
      - &check
        name: Image has the server and its deps
        run: docker run --rm --entrypoint sh notesgraph:test -c 'test -f /app/dist/main.js && test -d /app/node_modules/@nestjs/core && echo ok'

  second:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *disk
      - *buildx
      - *restore_native
      - *restore_compress
      - *restore_yarn
      - *contexts
      - *build
      - *export_native
      - *save_native
      - *export_yarn
      - *save_yarn
      - *check
