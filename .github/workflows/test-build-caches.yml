name: Test build caches (temporary)

# TEMPORARY, for measuring the deploy build caches: delete before merging.
# Builds the prod image the way deploy-prod.yml does (no push, no deploy):
# `first` with whatever is cached and saves both caches; `second` after a
# one-line frontend edit (as a typical deploy changes a few bundles),
# restoring them. Compare docker-clean's "reused" count and both build times.

on:
  push:
    branches: [deploy-reuse-compressed-assets]

permissions:
  contents: read

jobs:
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - &free
        name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
      - uses: docker/setup-buildx-action@v3
      - &restore_native
        name: Restore the Rust addon
        id: native
        uses: actions/cache/restore@v4
        with:
          path: native-prebuilt
          key: server-native-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/backend/native/**', 'packages/common/native/**', 'packages/frontend/mobile-native/**', 'packages/frontend/native/**', '.github/deployment/node/Dockerfile.selfhost') }}
      - &restore_compress
        name: Restore compressed assets
        uses: actions/cache/restore@v4
        with:
          path: compress-cache
          key: compressed-assets-${{ github.sha }}-${{ github.job }}
          restore-keys: compressed-assets-
      - &contexts
        name: Build contexts
        run: |
          mkdir -p native-prebuilt compress-cache
          echo "compress cache in: $(ls compress-cache | wc -l) files"
      - &build
        name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile.selfhost
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NATIVE_STAGE=${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
          build-contexts: |
            native-prebuilt-files=native-prebuilt
            compress-cache-files=compress-cache
          tags: notesgraph:test
          load: true
      - &export_native
        name: Export the Rust addon
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --target native-export --output type=local,dest=native-prebuilt .
          test -s native-prebuilt/server-native.node
      - &save_native
        name: Save the Rust addon
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-prebuilt
          key: ${{ steps.native.outputs.cache-primary-key }}
      - &export_compress
        name: Export compressed assets
        env:
          NATIVE_STAGE: ${{ steps.native.outputs.cache-hit == 'true' && 'native-prebuilt' || 'native' }}
        run: |
          docker buildx build --platform linux/amd64 \
            -f .github/deployment/node/Dockerfile.selfhost \
            --build-arg GITHUB_SHA=${{ github.sha }} \
            --build-arg NATIVE_STAGE="$NATIVE_STAGE" \
            --build-context native-prebuilt-files=native-prebuilt \
            --build-context compress-cache-files=compress-cache \
            --target compress-cache-export --output type=local,dest=compress-cache-new .
          rm -rf compress-cache && mv compress-cache-new compress-cache
          echo "$(ls compress-cache | wc -l) files, $(du -sh compress-cache | cut -f1)"
      - &save_compress
        name: Save compressed assets
        uses: actions/cache/save@v4
        with:
          path: compress-cache
          key: compressed-assets-${{ github.sha }}-${{ github.job }}
      - &check
        name: Image has the addon and compressed assets
        run: |
          docker run --rm --entrypoint sh notesgraph:test -c '
            test -n "$(find /app/dist -name "server-native*.node")" &&
            n=$(find /app/static -name "*.br" | wc -l) && echo "br files: $n" && test "$n" -gt 100'

  second:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: A typical change (one frontend line)
        run: echo "export const __buildCacheProbe = '${{ github.run_id }}';" >> packages/frontend/core/src/index.ts
      - *free
      - uses: docker/setup-buildx-action@v3
      - *restore_native
      - *restore_compress
      - *contexts
      - *build
      - *export_native
      - *save_native
      - *export_compress
      - *save_compress
      - *check
