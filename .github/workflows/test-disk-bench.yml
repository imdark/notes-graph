name: Test disk bench (temporary)

# TEMPORARY: is the runner's /mnt slower than / for the image build's I/O?
# Delete before merging. Three runners, each timing both disks the same way.

on:
  push:
    branches: [deploy-reuse-compressed-assets]
    paths: ['.github/workflows/test-disk-bench.yml']

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          df -h / /mnt
      - name: Bench / and /mnt
        run: |
          bench() {
            dir="$1/bench-$$"; sudo mkdir -p "$dir"; sudo chown "$USER" "$dir"
            # Large sequential write, flushed (layers, images).
            seq=$( { /usr/bin/time -f %e dd if=/dev/zero of="$dir/big" bs=1M count=2048 conv=fdatasync status=none; } 2>&1 )
            # Many small files written then read back (node_modules, yarn).
            small=$( { /usr/bin/time -f %e python3 -c 'import os,sys; r=sys.argv[1]; [os.makedirs(os.path.join(r,str(d))) for d in range(200)]; [open(os.path.join(r,str(d),f"{f}.js"),"w").write("x"*2048) for d in range(200) for f in range(250)]; n=sum(len(open(os.path.join(dp,f)).read()) for dp,_,fs in os.walk(r) for f in fs); os.sync()' "$dir/small"; } 2>&1 | tail -1 )
            sudo rm -rf "$dir"
            echo "$1: 2 GB write ${seq}s, 50k small files ${small}s"
          }
          for i in 1 2; do bench /; bench /mnt; done
