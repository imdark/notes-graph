name: notesgraph
services:
  notesgraph:
    image: ghcr.io/notesgraph/notesgraph:${NOTESGRAPH_REVISION:-stable}
    container_name: notesgraph_server
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      notesgraph_migration:
        condition: service_completed_successfully
    volumes:
      # custom configurations
      - ${UPLOAD_LOCATION}:/root/.notesgraph/storage
      - ${CONFIG_LOCATION}:/root/.notesgraph/config
    env_file:
      - .env
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-notesgraph}
      - NOTESGRAPH_INDEXER_ENABLED=false
      - NOTESGRAPH_COMPANION_URL=${NOTESGRAPH_COMPANION_URL:-}
    restart: unless-stopped

  # Optional: only needed for Google Drive/Dropbox uploads. No-ops (still
  # starts, but grants no remote sources) if the COMPANION_* vars in .env
  # are unset — safe to leave running either way, or comment out entirely.
  uppy_companion:
    image: ghcr.io/notesgraph/uppy-companion:${NOTESGRAPH_REVISION:-stable}
    container_name: notesgraph_uppy_companion
    ports:
      - '${COMPANION_PORT:-3020}:3020'
    env_file:
      - .env
    restart: unless-stopped

  notesgraph_migration:
    image: ghcr.io/notesgraph/notesgraph:${NOTESGRAPH_REVISION:-stable}
    container_name: notesgraph_migration_job
    volumes:
      # custom configurations
      - ${UPLOAD_LOCATION}:/root/.notesgraph/storage
      - ${CONFIG_LOCATION}:/root/.notesgraph/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    env_file:
      - .env
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-notesgraph}
      - NOTESGRAPH_INDEXER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis
    container_name: notesgraph_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: notesgraph_postgres
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-notesgraph}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # you better set a password for you database
      # or you may add 'POSTGRES_HOST_AUTH_METHOD=trust' to ignore postgres security policy
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', "${DB_USERNAME}", '-d', "${DB_DATABASE:-notesgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
