[package]
edition = "2024"
name    = "notesgraph_native"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
notesgraph_common = { workspace = true, features = ["hashcash"] }
notesgraph_media_capture = { path = "./media_capture" }
notesgraph_nbstore = { workspace = true, features = ["napi"] }
notesgraph_sqlite_v1 = { path = "./sqlite_v1" }
once_cell = { workspace = true }
sqlx = { workspace = true, default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mermaid-rs-renderer = { workspace = true }
typst               = { workspace = true }
typst-as-lib        = { workspace = true }
typst-svg           = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm")))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
chrono     = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
sqlx = { workspace = true, default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
tokio = { workspace = true, features = ["full"] }
