[package]
edition = "2024"
name    = "notesgraph_mobile_native"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[features]
default    = ["use-as-lib"]
use-as-lib = ["notesgraph_nbstore/use-as-lib"]

[dependencies]
anyhow             = { workspace = true }
base64-simd        = { workspace = true }
chrono             = { workspace = true }
futures-util       = { workspace = true }
notesgraph_common  = { workspace = true, features = ["hashcash"] }
notesgraph_nbstore = { workspace = true }
rustls             = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite  = { workspace = true }
uniffi             = { workspace = true, features = ["cli", "tokio"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSFileManager",
  "NSPathUtilities",
  "NSString",
  "NSURL",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
homedir = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
lru                 = { workspace = true }
mermaid-rs-renderer = { workspace = true }
typst               = { workspace = true }
typst-as-lib        = { workspace = true }
typst-svg           = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
lru   = { workspace = true }
tokio = { workspace = true, features = ["full"] }
