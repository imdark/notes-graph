<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotesGraph Plugin Market</title>
    <meta
      name="description"
      content="Browse NotesGraph plugins, become a developer, and publish plugins signed with your own key."
    />
    <link rel="stylesheet" href="site/style.css" />
    <meta name="theme-color" content="#0b0714" />
    <link rel="icon" type="image/png" href="site/favicon-48.png" />
    <link
      rel="preload"
      href="site/fonts/orbitron-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">
        <img
          class="brand-logo"
          src="site/app-logo-192.png"
          width="28"
          height="28"
          alt=""
        />
        <span>NotesGraph<b>/market</b></span>
      </a>
      <nav id="nav" class="nav" aria-label="Pages"></nav>
      <div id="who" class="who"></div>
    </header>
    <main id="app" class="app">
      <p class="muted">Loading…</p>
    </main>
    <footer class="foot">
      <span
        >Plugins run inside NotesGraph with the permissions they declare.</span
      >
      <span id="registry-key" class="muted"></span>
    </footer>
    <script type="module" src="site/app.js"></script>
  </body>
</html>
