<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=<%= VIEWPORT_FIT %>"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>NotesGraph</title>
    <meta name="theme-color" content="#0e0e14" />
    <%= PRECONNECT %>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <meta name="emotion-insertion-point" content="" />
    <meta property="description" content="<%= DESCRIPTION %>" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.notesgraph.com/" />
    <meta
      name="twitter:title"
      content="NotesGraph: There can be more than Notion and Miro."
    />
    <meta name="twitter:description" content="<%= DESCRIPTION %>" />
    <meta name="twitter:site" content="@NotesGraphOfficial" />
    <meta name="twitter:image" content="https://notesgraph.com/og.jpeg" />
    <meta
      property="og:title"
      content="NotesGraph: There can be more than Notion and Miro."
    />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="<%= DESCRIPTION %>" />
    <meta property="og:url" content="https://app.notesgraph.com/" />
    <meta property="og:image" content="https://notesgraph.com/og.jpeg" />

    <!--
      Plugins are loaded with a bare import() from a URL. Without this they
      bundle their own React, and a second React instance cannot render hooks
      into the host's tree - the dispatcher it reads is not the one the host's
      renderer installed. These shims forward the host's single instance
      (published on a global by modules/plugin/runtime.ts).

      Inert for the app itself: its own scripts are classic, not modules, and
      rspack resolves their imports at build time. Only plugin import() calls
      consult this map. It must appear before any module resolution happens,
      hence its position in <head>.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/plugin-runtime/react.js",
          "react/jsx-runtime": "/plugin-runtime/jsx-runtime.js",
          "react/jsx-dev-runtime": "/plugin-runtime/jsx-dev-runtime.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="app" data-version="<%= GIT_SHORT_SHA %>"></div>
  </body>
</html>
