<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 460px;
        margin: 40px auto;
        color: #1a1a1a;
      }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      p.hint { color: #666; font-size: 13px; }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #1e96eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .saved { color: #0a7; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h2>NotesGraph Web Clipper — Settings</h2>
    <label for="base">NotesGraph app URL</label>
    <input id="base" placeholder="https://app.notesgraph.com" />
    <p class="hint">
      The workspace you clip into. Use your self-hosted URL, or
      http://localhost:8080 for local development.
    </p>
    <button id="save">Save</button>
    <span class="saved" id="saved"></span>
    <script src="options.js"></script>
  </body>
</html>
