<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1a1a1a;
      }
      .wrap { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; color: #666; }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: #1e96eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { margin-top: 10px; min-height: 16px; color: #444; }
      .status.err { color: #d23; }
      .status.ok { color: #0a7; }
      a { color: #1e96eb; font-size: 12px; }
      .foot { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>NotesGraph Web Clipper</h1>
      <p class="sub">Save this page — text &amp; images — to NotesGraph.</p>
      <button id="clip">Clip this page</button>
      <div class="status" id="status"></div>
      <div class="foot"><a href="#" id="opts">Settings</a></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
